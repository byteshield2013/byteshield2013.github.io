<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ByteShield</title>
  <link rel="canonical" href="https://www.byteshield.com/en/">
  <script>
    // zh -> /zh/, ja -> /ja/, anything else -> /en/.
    // Locale-prefixed URLs (ads, shared links) never hit this page.
    (function () {
      var langs = navigator.languages || [navigator.language || '']
      var dest = '/en/'
      for (var i = 0; i < langs.length; i++) {
        var p = String(langs[i]).toLowerCase().split('-')[0]
        if (p === 'zh' || p === 'ja' || p === 'en') {
          dest = '/' + p + '/'
          break
        }
      }
      window.location.replace(dest)
    })()
  </script>
  <noscript><meta http-equiv="refresh" content="0;url=/en/"></noscript>
</head>
<body></body>
</html>
